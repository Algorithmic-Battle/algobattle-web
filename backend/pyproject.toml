[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "algobattle_web"
version = "0.18.0"
requires-python = "~=3.14.0"
license = {text = "MIT"}
authors = [{name = "Imogen Hergeth"}, {name = "Henri Lotze"}]
urls = {github = "https://github.com/Algorithmic-Battle/algobattle-web"}
classifiers = [
    "Natural Language :: English",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "algobattle-base==4.3.5",
    "uvicorn~=0.54.0",
    "fastapi~=0.141.1",
    "python-jose[cryptography]~=3.5.0",
    "python-multipart~=0.0.32",
    "sqlalchemy~=2.1.1",
    "pydantic~=2.13.5",
    "pydantic-extra-types~=2.11.1",
    "markdown~=3.11",
    "mysqlclient~=2.3.0",
    "sqlalchemy-utils~=0.42.1",
    "alembic~=1.20.0",
]

[dependency-groups]
dev = [
    "watchfiles~=1.3.0",
]

[project.scripts]
algobattle_api = "algobattle_web.app:create_openapi"
algobattle_runner = "algobattle_web.battle:main"

[tool.uv.build-backend]
module-name = "algobattle_web"
